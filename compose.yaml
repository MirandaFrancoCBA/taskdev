services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskdev}
      POSTGRES_USER: ${POSTGRES_USER:-taskdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskdev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskdev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskdev} -d ${POSTGRES_DB:-taskdev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - taskdev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskdev_postgres_data:
  taskdev_redis_data:
